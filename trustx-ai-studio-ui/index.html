    <script>
      // Ignore WebSocket and HMR errors per AI Studio environment constraints
      window.addEventListener('error', function(event) {
        if (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client') || event.message.includes('createWebSocketModuleRunnerTransport'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
           String(event.reason).includes('@vite/client') ||
           String(event.reason).includes('createWebSocketModuleRunnerTransport'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
